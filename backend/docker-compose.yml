services:
  postgres:
    image: postgres:16-alpine
    container_name: devmeme-hub-postgres
    environment:
      POSTGRES_DB: devmeme_hub
      POSTGRES_USER: devmeme
      POSTGRES_PASSWORD: devmeme
    ports:
      - "5432:5432"
    volumes:
      - devmeme_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmeme -d devmeme_hub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  devmeme_postgres_data:
