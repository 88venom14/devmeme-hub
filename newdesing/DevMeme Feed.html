<meta charset="utf-8" />

<title>devmeme — лента</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@400;500;600;700&family=Cascadia+Mono:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700&family=Geist:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  :root {
    --accent-h: 50;
    --accent: oklch(0.72 0.18 var(--accent-h));
    --bg-0: oklch(0.155 0.008 60);
    --bg-1: oklch(0.185 0.01 60);
    --bg-2: oklch(0.22 0.01 60);
    --bg-3: oklch(0.27 0.012 60);
    --border: oklch(0.27 0.008 60);
    --border-2: oklch(0.35 0.01 60);
    --text-1: oklch(0.96 0.005 60);
    --text-2: oklch(0.78 0.005 60);
    --text-3: oklch(0.55 0.008 60);
    --font-ui: "Cascadia Code", "Cascadia Mono", ui-monospace, monospace;
    --font-mono: "Cascadia Mono", "JetBrains Mono", ui-monospace, monospace;
    --font-display: "Cascadia Code", "Instrument Serif", serif;
    --card-radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg-0);
    color: var(--text-1);
    font-family: var(--font-ui);
    font-feature-settings: "ss01", "cv01";
    -webkit-font-smoothing: antialiased;
  }
  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 999px; border: 2px solid var(--bg-0); }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-2); }

  /* Animations */
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .icon-fill { fill: currentColor !important; stroke: none !important; }

  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  ::selection { background: oklch(0.65 0.18 var(--accent-h) / 0.4); }

  /* Markdown rendering */
  .md p { margin: 0 0 12px; }
  .md h1, .md h2, .md h3 { color: var(--text-1); margin: 18px 0 8px; line-height: 1.25; }
  .md h1 { font-size: 22px; font-weight: 700; }
  .md h2 { font-size: 18px; font-weight: 600; }
  .md h3 { font-size: 15px; font-weight: 600; }
  .md ul { margin: 0 0 12px; padding-left: 20px; }
  .md li { margin: 4px 0; }
  .md code { background: var(--bg-2); padding: 1px 6px; border-radius: 4px; font-family: var(--font-mono); font-size: 0.92em; color: var(--accent); }
  .md a { color: var(--accent); text-decoration: none; border-bottom: 1px solid currentColor; }
  .md strong { color: var(--text-1); font-weight: 600; }

  /* Responsive */
  @media (max-width: 1100px) {
    main { grid-template-columns: 1fr !important; }
    aside { position: static !important; }
  }
  /* Card spacing default */
  article header { min-width: 0; }
  /* Prevent text overflow in tags */
  button { min-width: 0; }
</style>
</head>
<body>
<div id="root"></div>
